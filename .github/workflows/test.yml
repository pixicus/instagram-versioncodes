name: Test Extract Instagram VersionCodes

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test APKCombo content
        run: |
          curl -L \
            --fail \
            --silent \
            --show-error \
            --compressed \
            -A "Mozilla/5.0" \
            "https://apkcombo.com/instagram/com.instagram.android/download/apk" \
            -o apkcombo.html

          echo "File size:"
          wc -c apkcombo.html

          echo ""
          echo "Instagram occurrences:"
          grep -oi "Instagram" apkcombo.html | wc -l || true

          echo ""
          echo "443 version occurrences:"
          grep -o "443\.0\.0\.48\.82" apkcombo.html | wc -l || true

          echo ""
          echo "Context around version 443:"
          grep -n -B 5 -A 10 "443\.0\.0\.48\.82" apkcombo.html \
            | head -150 || true
